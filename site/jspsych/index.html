<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DataPipe testbed — jsPsych + extension-pipe</title>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" />
    <link rel="stylesheet" href="../style.css" />
    <!-- jsPsych and a trial plugin from the CDN, pinned. -->
    <script src="https://unpkg.com/jspsych@8.3.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.2.0"></script>
    <!--
      extension-pipe from the CDN, pinned like everything else here: a testbed
      that silently follows `latest` stops telling you which version you tested.
      Bump it deliberately when a new release needs checking.

      datapipe-client is not loaded separately here: the extension's browser
      bundle already contains it, and Firebase, inside.
    -->
    <script src="https://unpkg.com/@jspsych/extension-pipe@0.2.0"></script>
  </head>
  <body class="testbed">
    <header class="bar">
      <a href="../">DataPipe testbed</a>
      <span>jsPsych + extension-pipe</span>
      <span id="run-settings" class="settings"></span>
    </header>
    <main id="target"></main>
    <section class="log-panel" aria-label="Request log">
      <h2>Log</h2>
      <div id="log" class="log"></div>
      <!--
        The same run in the form a driver asserts on. Collapsed, because these
        pages are read on phones and a wall of JSON under every run would push
        the log off the screen. See common.js for the contract.
      -->
      <details class="result-panel">
        <summary>Machine-readable result</summary>
        <pre id="testbed-result"></pre>
      </details>
    </section>
    <script type="module" src="./experiment.js"></script>
  </body>
</html>
