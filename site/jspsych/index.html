<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DataPipe testbed — jsPsych + extension-pipe</title>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" />
    <link rel="stylesheet" href="../style.css" />
    <!-- jsPsych and a trial plugin from the CDN, pinned. -->
    <script src="https://unpkg.com/jspsych@8.3.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.2.0"></script>
    <!--
      extension-pipe is NOT loaded from the CDN: it is unreleased. This is the
      committed browser bundle -- see vendor/extension-pipe/SOURCE.md for the
      commit it was built from. Swap this for
      https://unpkg.com/@jspsych/extension-pipe once it publishes; running the
      unreleased build first is the whole point of the testbed.

      datapipe-client is not loaded separately here: the extension's browser
      bundle already contains it, and Firebase, inside.
    -->
    <script src="../vendor/extension-pipe/index.browser.min.js"></script>
  </head>
  <body class="testbed">
    <header class="bar">
      <a href="../">DataPipe testbed</a>
      <span>jsPsych + extension-pipe</span>
      <span id="run-settings" class="settings"></span>
    </header>
    <main id="target"></main>
    <section class="log-panel" aria-label="Request log">
      <h2>Log</h2>
      <div id="log" class="log"></div>
    </section>
    <script type="module" src="./experiment.js"></script>
  </body>
</html>
